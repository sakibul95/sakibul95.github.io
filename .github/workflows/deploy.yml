name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Required by actions/deploy-pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # ─── The one line to change when you move to a custom domain ───
      # Origin only: no trailing slash, no sub-path.
      NEXT_PUBLIC_SITE_URL: https://sakibul95.github.io
      #
      # This repo is a *user* site (sakibul95.github.io), served from the
      # domain root, so no sub-path prefix is needed. If you ever deploy this
      # from a project repo instead, uncomment the line below and set it to
      # "/<repo-name>" — otherwise every asset 404s.
      # NEXT_PUBLIC_BASE_PATH: /portfolio1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build static export
        run: npm run build

      - uses: actions/configure-pages@v5

      # `out/` is where `output: "export"` writes the site. It already
      # contains .nojekyll (from public/), which stops GitHub Pages from
      # discarding the _next/ directory.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
